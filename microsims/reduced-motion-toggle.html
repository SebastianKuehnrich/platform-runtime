<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroSim — Reduced Motion Toggle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a; color: #f8fafc;
      min-height: 100vh; padding: 2rem;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }

    .toggle-bar {
      display: flex; gap: 1rem; margin-bottom: 2rem; align-items: center;
      padding: 1rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem;
    }
    .toggle-bar label { font-size: 0.9rem; font-weight: 600; }
    .toggle-bar input { accent-color: #6366f1; width: 20px; height: 20px; cursor: pointer; }
    .status-badge {
      padding: 0.3rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700;
    }
    .status-badge.motion { background: #166534; color: #bbf7d0; }
    .status-badge.reduced { background: #7f1d1d; color: #fecaca; }

    .demo-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem; margin-bottom: 2rem;
    }
    .demo-item {
      background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem;
      padding: 1.25rem; text-align: center;
    }
    .demo-item h3 { font-size: 0.9rem; margin-bottom: 0.75rem; color: #e2e8f0; }

    @property --glow-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
    .glow-box {
      width: 120px; height: 80px; margin: 0 auto; position: relative;
      background: #0f172a; border-radius: 0.5rem;
    }
    .glow-box::before {
      content: ''; position: absolute; inset: -2px; z-index: -1;
      border-radius: 0.6rem;
      background: conic-gradient(from var(--glow-angle), #6366f1 0%, transparent 30%, transparent 70%, #6366f1 100%);
    }
    .glow-box.animate::before { animation: glow-spin 6s linear infinite; }
    @keyframes glow-spin { to { --glow-angle: 360deg; } }

    .hover-box {
      width: 120px; height: 40px; margin: 0 auto;
      background: #6366f1; border-radius: 0.5rem; color: white;
      display: grid; place-items: center; font-weight: 600; font-size: 0.85rem;
      cursor: pointer;
    }
    .hover-box.animate { transition: transform 0.2s ease, background 0.2s ease; }
    .hover-box.animate:hover { transform: scale(1.05); background: #4f46e5; }
    .hover-box:not(.animate) { transition: none; }

    .slide-box {
      width: 40px; height: 40px; margin: 0 auto;
      background: #22c55e; border-radius: 50%;
    }
    .slide-box.animate { animation: slide-bounce 2s ease-in-out infinite; }
    @keyframes slide-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .vt-box {
      width: 120px; height: 40px; margin: 0 auto;
      background: #f59e0b; border-radius: 0.5rem; color: #0f172a;
      display: grid; place-items: center; font-weight: 600; font-size: 0.8rem;
    }
    .vt-box.animate { animation: vt-fade 3s ease-in-out infinite alternate; }
    @keyframes vt-fade { from { opacity: 1; } to { opacity: 0.3; } }

    .explanation {
      background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem;
      padding: 1.25rem; font-size: 0.85rem; color: #94a3b8; line-height: 1.6;
    }
    .explanation code { background: #0f172a; padding: 0.1rem 0.35rem; border-radius: 0.25rem; color: #c7d2fe; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reduced Motion Toggle</h1>
    <p class="subtitle">Simuliere <code>prefers-reduced-motion: reduce</code> und beobachte den Unterschied.</p>

    <div class="toggle-bar">
      <input type="checkbox" id="reduceToggle" onchange="toggleMotion()">
      <label for="reduceToggle">prefers-reduced-motion: reduce</label>
      <span class="status-badge motion" id="badge">Animations ON</span>
    </div>

    <div class="demo-grid">
      <div class="demo-item">
        <h3>@property Conic Glow</h3>
        <div class="glow-box animate" id="glowBox"></div>
      </div>
      <div class="demo-item">
        <h3>Hover Transition</h3>
        <div class="hover-box animate" id="hoverBox">Hover me</div>
      </div>
      <div class="demo-item">
        <h3>Bounce Animation</h3>
        <div class="slide-box animate" id="slideBox"></div>
      </div>
      <div class="demo-item">
        <h3>View Transition Sim</h3>
        <div class="vt-box animate" id="vtBox">Page Switch</div>
      </div>
    </div>

    <div class="explanation" id="explanation"></div>
  </div>

  <script>
    function toggleMotion() {
      const reduced = document.getElementById('reduceToggle').checked;
      const badge = document.getElementById('badge');
      const items = ['glowBox', 'hoverBox', 'slideBox', 'vtBox'];
      const expl = document.getElementById('explanation');

      items.forEach(id => {
        const el = document.getElementById(id);
        if (reduced) {
          el.classList.remove('animate');
        } else {
          el.classList.add('animate');
        }
      });

      if (reduced) {
        badge.textContent = 'Animations OFF';
        badge.className = 'status-badge reduced';
        expl.innerHTML = `
          <strong>prefers-reduced-motion: reduce</strong> aktiv.<br>
          Alle Animationen sind gestoppt. User mit Vestibular-Disorders, Migraene oder ADHS sehen eine <strong>ruhige Page</strong>.<br><br>
          Production-Pattern:<br>
          <code>@media (prefers-reduced-motion: no-preference) { .element { animation: ... } }</code><br>
          Animation ist Opt-In, nicht Opt-Out. Plus ein globales Safety-Net:<br>
          <code>@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; } }</code>
        `;
      } else {
        badge.textContent = 'Animations ON';
        badge.className = 'status-badge motion';
        expl.innerHTML = `
          <strong>prefers-reduced-motion: no-preference</strong> — Animationen laufen normal.<br>
          Conic-Gradient rotiert, Hover-Transitions sind aktiv, Bounce laeuft, View-Transition-Sim pulst.<br><br>
          In den System-Settings (Windows: Einstellungen → Barrierefreiheit → Animationen; macOS: Systemeinstellungen → Bedienungshilfen → Bewegung reduzieren) koennen User das global aktivieren.
        `;
      }
    }

    toggleMotion();
  </script>
</body>
</html>
