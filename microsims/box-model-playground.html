<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroSim — Box Model Playground</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .container { width: 100%; max-width: 860px; }
    h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .layout { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; }
    .controls { display: flex; flex-direction: column; gap: 1.25rem; }
    .control label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.85rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.35rem;
    }
    .control label span { color: #6366f1; font-family: 'Fira Code', monospace; }
    .control input[type="range"] {
      width: 100%; accent-color: #6366f1; cursor: pointer;
    }
    .toggle-row {
      display: flex; gap: 0.5rem; margin-top: 0.5rem;
    }
    .toggle-btn {
      flex: 1; padding: 0.6rem; border: 1px solid #334155; border-radius: 0.5rem;
      background: #1e293b; color: #94a3b8; font: inherit; font-size: 0.8rem;
      font-weight: 600; cursor: pointer; text-align: center;
    }
    .toggle-btn.active { background: #6366f1; color: white; border-color: #6366f1; }
    .visualization {
      display: grid; place-items: center;
      background: #1e293b; border-radius: 0.75rem; border: 1px solid #334155;
      padding: 1.5rem; min-height: 360px;
    }
    .box-model {
      display: grid; place-items: center; position: relative;
    }
    .layer-margin {
      background: rgba(249, 115, 22, 0.15);
      border: 2px dashed rgba(249, 115, 22, 0.5);
      display: grid; place-items: center;
      position: relative;
    }
    .layer-border {
      background: rgba(250, 204, 21, 0.25);
      display: grid; place-items: center;
    }
    .layer-padding {
      background: rgba(34, 197, 94, 0.2);
      display: grid; place-items: center;
    }
    .layer-content {
      background: rgba(99, 102, 241, 0.3);
      border: 1px solid rgba(99, 102, 241, 0.6);
      display: grid; place-items: center;
      font-size: 0.75rem; font-weight: 600; color: #c7d2fe;
    }
    .layer-label {
      position: absolute; font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .info-bar {
      margin-top: 1.5rem;
      background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem;
      padding: 1rem; display: flex; justify-content: space-around; text-align: center;
    }
    .info-item { display: flex; flex-direction: column; gap: 0.25rem; }
    .info-item .val { font-size: 1.25rem; font-weight: 800; color: #6366f1; font-family: 'Fira Code', monospace; }
    .info-item .lbl { font-size: 0.7rem; color: #64748b; text-transform: uppercase; }
    @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Box Model Playground</h1>
    <p class="subtitle">Slider bewegen, box-sizing togglen, Unterschied verstehen.</p>

    <div class="layout">
      <div class="controls">
        <div class="control">
          <label>Content Width <span id="valW">200</span>px</label>
          <input type="range" id="sliderW" min="60" max="300" value="200">
        </div>
        <div class="control">
          <label>Padding <span id="valP">20</span>px</label>
          <input type="range" id="sliderP" min="0" max="60" value="20">
        </div>
        <div class="control">
          <label>Border <span id="valB">2</span>px</label>
          <input type="range" id="sliderB" min="0" max="20" value="2">
        </div>
        <div class="control">
          <label>Margin <span id="valM">16</span>px</label>
          <input type="range" id="sliderM" min="0" max="40" value="16">
        </div>
        <div>
          <label style="font-size:0.85rem;font-weight:600;color:#94a3b8;">box-sizing</label>
          <div class="toggle-row">
            <button class="toggle-btn" id="btnContent" onclick="setMode('content-box')">content-box</button>
            <button class="toggle-btn active" id="btnBorder" onclick="setMode('border-box')">border-box</button>
          </div>
        </div>
      </div>

      <div class="visualization" id="viz"></div>
    </div>

    <div class="info-bar">
      <div class="info-item"><span class="val" id="totalW">—</span><span class="lbl">Gesamtbreite</span></div>
      <div class="info-item"><span class="val" id="contentW">—</span><span class="lbl">Content-Breite</span></div>
      <div class="info-item"><span class="val" id="modeLabel">—</span><span class="lbl">Modus</span></div>
    </div>
  </div>

  <script>
    let mode = 'border-box';

    function setMode(m) {
      mode = m;
      document.getElementById('btnContent').className = 'toggle-btn' + (m === 'content-box' ? ' active' : '');
      document.getElementById('btnBorder').className = 'toggle-btn' + (m === 'border-box' ? ' active' : '');
      update();
    }

    function update() {
      const w = +document.getElementById('sliderW').value;
      const p = +document.getElementById('sliderP').value;
      const b = +document.getElementById('sliderB').value;
      const m = +document.getElementById('sliderM').value;

      document.getElementById('valW').textContent = w;
      document.getElementById('valP').textContent = p;
      document.getElementById('valB').textContent = b;
      document.getElementById('valM').textContent = m;

      let contentActual, totalWidth;
      if (mode === 'content-box') {
        contentActual = w;
        totalWidth = w + p * 2 + b * 2 + m * 2;
      } else {
        contentActual = Math.max(0, w - p * 2 - b * 2);
        totalWidth = w + m * 2;
      }

      document.getElementById('totalW').textContent = totalWidth + 'px';
      document.getElementById('contentW').textContent = contentActual + 'px';
      document.getElementById('modeLabel').textContent = mode;

      const scale = 0.65;
      const mS = m * scale, bS = b * scale, pS = p * scale, cS = contentActual * scale;

      const viz = document.getElementById('viz');
      viz.innerHTML = `
        <div class="layer-margin" style="padding:${mS}px; position:relative;">
          <span class="layer-label" style="top:2px;left:4px;color:#f97316;">margin ${m}px</span>
          <div class="layer-border" style="padding:${bS}px;">
            <span class="layer-label" style="top:2px;left:4px;color:#facc15;font-size:0.55rem;">border ${b}px</span>
            <div class="layer-padding" style="padding:${pS}px; position:relative;">
              <span class="layer-label" style="top:2px;left:4px;color:#22c55e;font-size:0.55rem;">padding ${p}px</span>
              <div class="layer-content" style="width:${cS}px;height:${cS * 0.6}px;min-width:20px;min-height:20px;">
                ${contentActual}x${Math.round(contentActual * 0.6)}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    document.querySelectorAll('input[type=range]').forEach(el => el.addEventListener('input', update));
    update();
  </script>
</body>
</html>
