<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login — Sebastian K. Platform Runtime Showcase.">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>S</text></svg>">
  <title>Sebastian — Login</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="transitions.css">
  <link rel="stylesheet" href="tooltips.css">
  <link rel="stylesheet" href="effects.css">
  <script>if(localStorage.getItem('theme-dark')==='true'){document.documentElement.classList.add('dark-preload')}</script>
</head>
<body>
  <a href="#main" class="skip-link">Zum Inhalt springen</a>

  <header class="site-nav">
    <a href="index.html" class="brand">Sebastian — Platform Runtime</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
    <label for="nav-toggle" class="hamburger" aria-label="Navigation oeffnen">
      <span></span><span></span><span></span>
    </label>
    <nav>
      <a href="index.html">Home</a>
      <a href="pricing.html">Pricing</a>
      <a href="profile.html">Profile</a>
      <a href="projects.html">Projects</a>
      <a href="login.html" aria-current="page">Login</a>
    </nav>
    <label class="theme-switch" aria-label="Dark Mode umschalten">
      <input type="checkbox" id="theme-toggle">
      <span class="theme-switch-slider"></span>
    </label>
  </header>

  <main class="page page-login" id="main">
    <div class="login-card">
      <h1>Willkommen zurueck</h1>
      <p class="subtitle">Melde dich an, um deine Projekte zu sehen.</p>

      <form class="login-form" novalidate>
        <div class="field">
          <label for="email">E-Mail</label>
          <input type="email" id="email" name="email" placeholder="name@firma.com" required>
        </div>

        <div class="field">
          <label for="password">Passwort</label>
          <input type="password" id="password" name="password" placeholder="Mindestens 8 Zeichen" required minlength="8">
        </div>

        <button type="submit" class="btn btn-primary">Anmelden</button>

        <p class="forgot"><a href="#">Passwort vergessen?</a></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p>Sebastian K. · Morphos Advanced CSS Cohort · Mai 2026</p>
  </footer>

  <script>
    const toggle = document.getElementById('theme-toggle');
    if (localStorage.getItem('theme-dark') === 'true') toggle.checked = true;
    toggle.addEventListener('change', () => localStorage.setItem('theme-dark', toggle.checked));
  </script>
</body>
</html>
